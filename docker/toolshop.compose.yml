# Self-hosted Toolshop for CI, UI on :4200, API on :8091 ports.
name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DISABLE_LOGGING=true
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - 4200:4200

  # Same as the Toolshop web image, which is published for arm64 only and fails on x86 runners.
  web:
    image: nginx:1.23.3-alpine
    volumes:
      - ./vhost.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8091:80
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
